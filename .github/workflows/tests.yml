on: [push]
name: build

jobs:
  test:
    runs-on: ubuntu-latest # or macOS-latest, or windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: haskell/actions/setup@v2
        with:
          ghc-version: '9.0.2' # Exact version of ghc to use
          enable-stack: true
          stack-version: 'latest'
      - run: |
          gh --version
      - run: |
          stack --version
      - run: |
          stack test 2> /dev/null
