name: release

on:
  push:
    branches:
      - main
    paths:
      - package.yaml
  workflow_dispatch:
    inputs:
      publish:
        description: Build and publish the current version as a GitHub Release
        required: true
        type: boolean
        default: false

env:
  GHC_VERSION: "9.8.4"
  STACK_VERSION: "3.9.3"
  MUSL_BUILD_IMAGE: "docker.io/benz0li/ghc-musl@sha256:423b91446c8c0afbc4a3d08be94f297c3663a7586a29d6b7519e57a37bb3b0cc"
  ALPINE_TEST_IMAGE: "docker.io/library/alpine:3.24.1@sha256:79ff19e9084a00eece421b2523fb93e22d730e2c0e525905de047e848e56d95f"

permissions:
  contents: read

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect and validate version bump
        id: version
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          read_version() {
            sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$/\1/p' |
              head -n 1
          }

          current_version="$(read_version < package.yaml)"
          if [[ ! "$current_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "package.yaml does not contain a valid MAJOR.MINOR.PATCH version" >&2
            exit 1
          fi

          cabal_version="$(read_version < h2o.cabal)"
          if [[ "$cabal_version" != "$current_version" ]]; then
            echo "h2o.cabal version is '$cabal_version', expected '$current_version'" >&2
            exit 1
          fi

          if ! grep -qE "^## ${current_version//./\\.} \\([0-9]{4}-[0-9]{2}-[0-9]{2}\\)$" CHANGELOG.md; then
            echo "CHANGELOG.md has no dated section for $current_version" >&2
            exit 1
          fi

          tag="v$current_version"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            {
              echo "changed=true"
              echo "version=$current_version"
              echo "tag=$tag"
            } >> "$GITHUB_OUTPUT"
            if [[ "$PUBLISH_RELEASE" == "true" ]]; then
              echo "Preparing manually triggered release $tag"
            else
              echo "Running a build-only preflight for $current_version"
            fi
            exit 0
          fi

          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "Cannot compare package.yaml on the repository's initial push" >&2
            exit 1
          fi

          previous_version="$(git show "$BEFORE_SHA:package.yaml" | read_version)"
          if [[ ! "$previous_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "The previous package.yaml does not contain a valid MAJOR.MINOR.PATCH version" >&2
            exit 1
          fi

          if [[ "$current_version" == "$previous_version" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "package.yaml changed without a version bump; no release is needed"
            exit 0
          fi

          IFS=. read -r previous_major previous_minor previous_patch <<< "$previous_version"
          IFS=. read -r current_major current_minor current_patch <<< "$current_version"
          if (( 10#$current_major < 10#$previous_major )) ||
             (( 10#$current_major == 10#$previous_major && 10#$current_minor < 10#$previous_minor )) ||
             (( 10#$current_major == 10#$previous_major && 10#$current_minor == 10#$previous_minor && 10#$current_patch <= 10#$previous_patch )); then
            echo "Version must increase: $previous_version -> $current_version" >&2
            exit 1
          fi

          if tag_commit="$(git rev-list -n 1 "$tag" 2>/dev/null)" && [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "$tag already points to $tag_commit instead of $GITHUB_SHA" >&2
            exit 1
          fi

          {
            echo "changed=true"
            echo "version=$current_version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "Preparing release $tag for $GITHUB_SHA"

  build-release:
    needs: detect-version
    if: needs.detect-version.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            arch_pattern: x86_64
            build_kind: stack
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
            arch_pattern: arm64
            build_kind: stack
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            arch_pattern: x86-64
            build_kind: stack
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            arch_pattern: aarch64
            build_kind: stack
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            arch_pattern: x86-64
            build_kind: musl

    name: Build ${{ matrix.target }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Haskell Stack
        if: matrix.build_kind == 'stack'
        id: setup-haskell
        uses: haskell-actions/setup@v2
        with:
          cabal-update: false
          ghc-version: ${{ env.GHC_VERSION }}
          enable-stack: true
          stack-no-global: true
          stack-version: ${{ env.STACK_VERSION }}

      - name: Cache Stack files
        if: matrix.build_kind == 'stack'
        uses: actions/cache@v6
        with:
          path: ${{ steps.setup-haskell.outputs.stack-root }}
          key: ${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-stack-${{ env.STACK_VERSION }}-${{ hashFiles('stack.yaml', 'stack.yaml.lock', 'package.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-stack-${{ env.STACK_VERSION }}-

      - name: Cache musl Stack files
        if: matrix.build_kind == 'musl'
        uses: actions/cache@v6
        with:
          path: .stack-root-musl
          key: linux-x64-musl-ghc-${{ env.GHC_VERSION }}-423b91446c8c-${{ hashFiles('stack.yaml', 'stack.yaml.lock', 'package.yaml') }}
          restore-keys: |
            linux-x64-musl-ghc-${{ env.GHC_VERSION }}-423b91446c8c-

      - name: Install test fixture
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo install -m 0755 test/fixtures/mockcmd /usr/local/bin/mockcmd

      - name: Run test suite
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: stack test

      - name: Build release binary
        if: matrix.build_kind == 'stack'
        run: stack build --copy-bins

      - name: Build static musl release binary
        if: matrix.build_kind == 'musl'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .release-bin-musl .stack-root-musl .stack-work-musl
          docker run --rm \
            --env STACK_ROOT=/work/.stack-root-musl \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            "$MUSL_BUILD_IMAGE" \
            sh -c "stack --allow-different-user --system-ghc --no-install-ghc --work-dir .stack-work-musl build --flag h2o:static-executable --copy-bins --local-bin-path .release-bin-musl"

      - name: Verify and package the release binary
        shell: bash
        env:
          ARCH_PATTERN: ${{ matrix.arch_pattern }}
          BUILD_KIND: ${{ matrix.build_kind }}
          VERSION: ${{ needs.detect-version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          if [[ "$BUILD_KIND" == "musl" ]]; then
            binary="$GITHUB_WORKSPACE/.release-bin-musl/h2o"
          else
            binary="$(stack path --local-bin)/h2o"
          fi

          reported_version="$("$binary" --version)"
          if [[ "$reported_version" != "h2o $VERSION" ]]; then
            echo "h2o reports '$reported_version', expected 'h2o $VERSION'" >&2
            exit 1
          fi

          "$binary" --file test/golden/grep-input.txt --format json > "$RUNNER_TEMP/h2o-smoke.json"
          if ! grep -Eq '"name"[[:space:]]*:[[:space:]]*"grep-input"' "$RUNNER_TEMP/h2o-smoke.json"; then
            echo "h2o did not produce the expected JSON during its smoke test" >&2
            exit 1
          fi

          binary_description="$(file "$binary")"
          echo "$binary_description"
          if ! grep -Eiq "$ARCH_PATTERN" <<< "$binary_description"; then
            echo "Binary architecture does not match $ARCH_PATTERN" >&2
            exit 1
          fi
          if [[ "$BUILD_KIND" == "musl" ]] && ! grep -Eiq 'statically linked' <<< "$binary_description"; then
            echo "The Alpine binary is not statically linked" >&2
            exit 1
          fi

          mv "$binary" "h2o-$TARGET"
          chmod +x "h2o-$TARGET"
          tar -czf "h2o-$TARGET.tar.gz" "h2o-$TARGET"

          extracted_dir="$RUNNER_TEMP/h2o-release-smoke-$TARGET"
          mkdir -p "$extracted_dir"
          tar -xzf "h2o-$TARGET.tar.gz" -C "$extracted_dir"
          packaged_version="$("$extracted_dir/h2o-$TARGET" --version)"
          if [[ "$packaged_version" != "h2o $VERSION" ]]; then
            echo "Packaged h2o reports '$packaged_version', expected 'h2o $VERSION'" >&2
            exit 1
          fi

          if [[ "$BUILD_KIND" == "musl" ]]; then
            alpine_version="$(docker run --rm \
              --volume "$extracted_dir:/release:ro" \
              "$ALPINE_TEST_IMAGE" \
              "/release/h2o-$TARGET" --version)"
            if [[ "$alpine_version" != "h2o $VERSION" ]]; then
              echo "h2o reports '$alpine_version' on Alpine, expected 'h2o $VERSION'" >&2
              exit 1
            fi
          fi

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "h2o-$TARGET.tar.gz" > "h2o-$TARGET.tar.gz.sha256"
          else
            shasum -a 256 "h2o-$TARGET.tar.gz" > "h2o-$TARGET.tar.gz.sha256"
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: h2o-${{ matrix.target }}
          path: |
            ./h2o-${{ matrix.target }}.${{ matrix.archive }}
            ./h2o-${{ matrix.target }}.${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 7

  prepare-release:
    needs:
      - detect-version
      - build-release
    if: needs.detect-version.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download release binaries
        uses: actions/download-artifact@v8
        with:
          pattern: h2o-*
          path: release-assets
          merge-multiple: true

      - name: Verify and aggregate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob

          archives=(h2o-*.tar.gz)
          checksums=(h2o-*.sha256)
          if (( ${#archives[@]} != 5 || ${#checksums[@]} != 5 )); then
            echo "Expected 5 archives and 5 checksums, found ${#archives[@]} and ${#checksums[@]}" >&2
            exit 1
          fi

          for checksum in "${checksums[@]}"; do
            tr -d '\r' < "$checksum" | sha256sum --check -
          done
          sha256sum "${archives[@]}" | sort -k 2 > SHA256SUMS

      - name: Prepare release notes
        shell: bash
        env:
          VERSION: ${{ needs.detect-version.outputs.version }}
        run: |
          set -euo pipefail
          awk -v version="$VERSION" '
            index($0, "## " version " (") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-assets/release-notes.md
          if [[ ! -s release-assets/release-notes.md ]]; then
            echo "CHANGELOG.md section for $VERSION is empty" >&2
            exit 1
          fi

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v7
        with:
          name: verified-release-${{ needs.detect-version.outputs.tag }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish-release:
    needs:
      - detect-version
      - prepare-release
    if: needs.detect-version.outputs.changed == 'true' && (github.event_name == 'push' || inputs.publish == true)
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ needs.detect-version.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download verified release bundle
        uses: actions/download-artifact@v8
        with:
          name: verified-release-${{ needs.detect-version.outputs.tag }}
          path: release-assets

      - name: Create or verify annotated release tag
        shell: bash
        env:
          TAG: ${{ needs.detect-version.outputs.tag }}
          VERSION: ${{ needs.detect-version.outputs.version }}
        run: |
          set -euo pipefail

          remote_tag_commit() {
            local direct_ref="refs/tags/$TAG"
            local peeled_ref="$direct_ref^{}"
            local refs
            local commit

            refs="$(git ls-remote --tags origin "$direct_ref" "$peeled_ref")"
            commit="$(awk -v ref="$peeled_ref" '$2 == ref { print $1; exit }' <<< "$refs")"
            if [[ -z "$commit" ]]; then
              commit="$(awk -v ref="$direct_ref" '$2 == ref { print $1; exit }' <<< "$refs")"
            fi
            printf '%s' "$commit"
          }

          tag_commit="$(remote_tag_commit)"
          if [[ -n "$tag_commit" ]]; then
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "$TAG already points to $tag_commit instead of $GITHUB_SHA" >&2
              exit 1
            fi
            echo "$TAG already points to $GITHUB_SHA"
            exit 0
          fi

          git \
            -c 'user.name=github-actions[bot]' \
            -c 'user.email=41898282+github-actions[bot]@users.noreply.github.com' \
            tag -a "$TAG" "$GITHUB_SHA" -m "Release $VERSION"

          if git push origin "refs/tags/$TAG"; then
            echo "Created annotated tag $TAG at $GITHUB_SHA"
            exit 0
          fi

          # A concurrent run may have created the same tag after our first check.
          tag_commit="$(remote_tag_commit)"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "Failed to create $TAG; remote tag points to '${tag_commit:-nothing}'" >&2
            exit 1
          fi
          echo "$TAG was concurrently created at the expected commit"

      - name: Create or verify GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect-version.outputs.tag }}
          VERSION: ${{ needs.detect-version.outputs.version }}
        run: |
          set -euo pipefail

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if gh release create "$TAG" release-assets/h2o-* release-assets/SHA256SUMS \
              --verify-tag \
              --title "h2o $VERSION" \
              --notes-file release-assets/release-notes.md; then
              exit 0
            fi

            # Treat a concurrently created Release as a recoverable race.
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              echo "Failed to create Release $TAG" >&2
              exit 1
            fi
          fi

          echo "Release $TAG already exists; verifying its complete asset set"
          existing_dir="$RUNNER_TEMP/existing-release-$TAG"
          mkdir -p "$existing_dir"
          gh release download "$TAG" \
            --dir "$existing_dir" \
            --pattern 'h2o-*' \
            --pattern SHA256SUMS

          for expected_asset in release-assets/h2o-* release-assets/SHA256SUMS; do
            asset_name="${expected_asset##*/}"
            if [[ ! -f "$existing_dir/$asset_name" ]]; then
              echo "Release $TAG is missing $asset_name; refusing to mix assets from separate builds" >&2
              exit 1
            fi
          done

          cd "$existing_dir"
          shopt -s nullglob
          archives=(h2o-*.tar.gz)
          checksums=(h2o-*.sha256)
          if (( ${#archives[@]} != 5 || ${#checksums[@]} != 5 )); then
            echo "Release $TAG does not contain the expected 5 archives and 5 checksums" >&2
            exit 1
          fi
          for checksum in "${checksums[@]}"; do
            tr -d '\r' < "$checksum" | sha256sum --check -
          done
          sha256sum --check SHA256SUMS

          if [[ "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" == "true" ]]; then
            gh release edit "$TAG" --draft=false
          fi
